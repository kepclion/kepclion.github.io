<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回首往事，感慨万千</title>

    <style type="text/css">
        @font-face {
            font-family: 'Han';
            src: url("sourcehanR.otf") format("opentype");
        }

        @font-face {
            font-family: 'HHan';
            src: url("sourcehanB.otf") format("opentype");
        }

        @font-face {
            font-family: 'deyihei';
            src: url("deyihei.ttf");
        }

        @font-face {
            font-family: 'harmory';
            src: url("harmory.ttf");
        }

        *,
        :after,
        :before {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: 'harmory', serif, consolas, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 20px;
            line-height: 1.5;
            color: rgba(0, 0, 0, .85);
            background-color: rgb(249, 245, 233);
            font-weight: 100;
        }

        a {
            text-decoration: none;
            font-weight: inherit
        }

        code[class*="language-"],
        pre[class*="language-"] {
            color: rgba(0, 0, 0, .85);
            font-family: Consolas, Arial, Helvetica, sans-serif;
            direction: ltr;
            text-align: left;
            white-space: pre;
            word-spacing: normal;
            word-break: normal;
            line-height: 1.5;
            tab-size: 4;
            hyphens: none
        }

        pre[class*="language-"] {
            padding: 1em;
            margin: .5em 0;
            overflow: auto
        }

        :not(pre)>code[class*="language-"],
        pre[class*="language-"] {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, .2);
        }

        :not(pre)>code[class*="language-"] {
            padding: .1em;
            border-radius: .3em
        }

        .token.comment,
        .token.prolog,
        .token.doctype,
        .token.cdata {
            color: slategray
        }

        .token.punctuation {
            color: #999
        }

        .namespace {
            opacity: .7
        }

        .token.property,
        .token.tag,
        .token.boolean,
        .token.number,
        .token.constant,
        .token.symbol,
        .token.deleted {
            color: #905
        }

        .token.selector,
        .token.attr-name,
        .token.string,
        .token.char,
        .token.builtin,
        .token.inserted {
            color: #690
        }

        .token.operator,
        .token.entity,
        .token.url,
        .language-css .token.string,
        .style .token.string {
            color: #a67f59;
            background: hsla(0, 0, 100%, .5)
        }

        .token.atrule,
        .token.attr-value,
        .token.keyword {
            color: #07a
        }

        .token.function {
            color: #dd4a68
        }

        .token.regex,
        .token.important,
        .token.variable {
            color: #e90
        }

        .token.important,
        .token.bold {
            font-weight: bold
        }

        .token.italic {
            font-style: italic
        }

        .token.entity {
            cursor: help
        }

        .fontbutton {
            margin: 0;
            padding: 10px;
            border: 0;
            align-self: center;
            flex: auto;
            color: rgb(249, 245, 233);
            font-size: 20px;
            background: rgba(0, 0, 0, .85);
            height: 3em;
        }

        .buttonf {
            display: flex;
            flex-wrap: wrap;
            opacity: 0.85;

        }
    </style>
</head>

<body id="body">
    <div class="buttonf">
        <button class="fontbutton" onclick="Font_song()">思源宋体</button>
        <button class="fontbutton" onclick="Font_har()">鸿蒙黑体</button>
        <button class="fontbutton" onclick="Font_deh()">得意斜黑</button>
        <button class="fontbutton" onclick="Font_none()">Consolas</button>
    </div>
    <div style="padding-left: 10%;padding-right: 10%;">
        <p style="text-align: center;"><span style="font-size: x-large;">回首往事，感慨万千</span></p>
        <p class="">
            (2025.11.08)今天偶然启用了老电脑，看到里面的一些东西，不禁感慨万千，原来初中时候的我是那么雄心壮志，积极向上，而现在我只能放下爱好，为高考奋战，希望未来在大学里我能尽情释放自己的热爱，全身心投入到自己热爱的事情中。
        </p>
    </div>
    <script text="text/javascript" src="../one.js"></script>
</body>

</html>
